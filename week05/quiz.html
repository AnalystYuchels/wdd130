<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML and CSS Quiz</title>
  <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
  <main>
    <h1>HTML and CSS Quiz</h1>

    <form>
      <label for="q1">1. Fill in the blank: HTML stands for HyperText ______ Language.</label>
      <input type="text" id="q1" name="q1">

      <label for="q2">2. What is the purpose of CSS?</label>
      <textarea id="q2" name="q2" rows="4"></textarea>

      <label for="q3">3. Which HTML element is used to create a link?</label>
      <select id="q3" name="q3">
        <option value="" selected disabled>Choose One ...</option>
        <option value="p">p</option>
        <option value="a">a</option>
        <option value="img">img</option>
      </select>

      <label for="q4">4. How many levels of HTML headings are there?</label>
      <input type="number" id="q4" name="q4">

      <button type="submit">Submit Quiz</button>
    </form>
  </main>
</body>

</html>
